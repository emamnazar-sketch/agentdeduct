<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>AgentDeduct — Keep more of every commission</title>
    <meta name="description" content="The mileage-first tax deduction app for real estate agents. Track drives, expenses, and deals — private by design, with optional Google Drive backup." />
    <meta name="theme-color" content="#0d4d2f" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://agentdeduct.com/" />
    <meta property="og:title" content="AgentDeduct" />
    <meta property="og:description" content="The mileage-first tax deduction app for real estate agents. Private by design — your data stays yours." />
    <meta property="og:image" content="https://agentdeduct.com/assets/social-card.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="AgentDeduct" />
    <meta name="twitter:description" content="Keep more of every commission. Mileage, expenses, and deals — private by design." />
    <meta name="twitter:image" content="https://agentdeduct.com/assets/social-card.png" />
    <link rel="manifest" href="manifest.json?v=7" />
    <link rel="icon" href="assets/agentdeduct-logo.png?v=7" />
    <link rel="apple-touch-icon" href="assets/agentdeduct-logo.png?v=7" />
    <link rel="stylesheet" href="styles.css?v=8" />
    <script>
      try {
        var s = JSON.parse(localStorage.getItem("agentDeduct.db.v2") || "{}").settings || {};
        var mode = s.darkMode || "auto";
        var dark = mode === "dark" || (mode === "auto" && matchMedia("(prefers-color-scheme: dark)").matches);
        if (dark) document.documentElement.setAttribute("data-theme", "dark");
      } catch (e) {}
    </script>
  </head>
  <body>
    <div class="app">
      <header class="topbar">
        <div class="brand">
          <img src="assets/agentdeduct-logo.png?v=7" alt="AgentDeduct logo" />
          <span>AgentDeduct</span>
        </div>
        <div class="year-pill no-print">📅 <select id="yearSelect" aria-label="Tax year"></select></div>
        <button class="year-pill no-print" id="settingsBtn" type="button" aria-label="Settings" style="margin-left:8px;">⚙️</button>
      </header>

      <main id="views">
        <section class="view" id="view-home" aria-label="Home"></section>
        <section class="view" id="view-drives" aria-label="Drives"></section>
        <section class="view" id="view-deals" aria-label="Deals"></section>
        <section class="view" id="view-reports" aria-label="Reports"></section>
        <section class="view" id="view-settings" aria-label="Settings"></section>
      </main>
    </div>

    <nav class="tabbar no-print" aria-label="Main navigation">
      <div class="tabbar-in">
        <button class="tab active" data-tab="home" type="button"><span class="ti">🏠</span>Home</button>
        <button class="tab" data-tab="drives" type="button"><span class="ti">🚗</span>Drives</button>
        <button type="button" id="fabAdd" aria-label="Add expense or drive">
          <span class="fab">+</span>
          <span class="fab-label">Add</span>
        </button>
        <button class="tab" data-tab="deals" type="button"><span class="ti">🏘️</span>Deals</button>
        <button class="tab" data-tab="reports" type="button"><span class="ti">📊</span>Reports</button>
      </div>
    </nav>

    <div class="scrim" id="scrim"></div>
    <div class="sheet" id="addSheet" role="dialog" aria-modal="true" aria-label="Add expense or drive">
      <div class="grabber"></div>
      <h2 id="sheetTitle">Log expense</h2>
      <button class="btn-inline ghost" id="sheetClose" type="button" style="position:absolute;top:14px;right:16px;">Close</button>
      <div class="seg" role="tablist">
        <button type="button" id="segExpense" class="active">💰 Expense</button>
        <button type="button" id="segDrive">🚗 Drive</button>
      </div>

      <div id="paneExpense">
        <div class="field"><label for="fAmount">Amount</label>
          <div class="amount-wrap"><span class="cur">$</span>
          <input id="fAmount" class="amount-input" type="number" inputmode="decimal" step="0.01" min="0" placeholder="0.00" /></div>
        </div>
        <div class="field"><label>Category</label><div class="cat-grid" id="catGrid"></div></div>
        <div class="field"><label for="fVendor">Vendor / what was it?</label>
          <input id="fVendor" type="text" list="vendorList" placeholder="MLS, photographer, brokerage…" autocomplete="off" />
          <datalist id="vendorList"></datalist>
        </div>
        <div class="field" id="giftWrap" style="display:none;"><label for="fGiftFor">Who was the gift for?</label>
          <input id="fGiftFor" type="text" placeholder="Client name" autocomplete="off" />
        </div>
        <div class="warn" id="giftWarn" style="display:none;"></div>
        <div class="field"><label for="fDate">Date</label><input id="fDate" type="date" /></div>
        <div class="field"><label for="fDeal">Property (deal)</label><select id="fDeal"></select></div>
        <div class="field"><label>Was this all for work?</label>
          <div class="choice-row">
            <button type="button" class="choice active" id="choiceYes">Yes, 100%</button>
            <button type="button" class="choice" id="choicePartly">Partly</button>
          </div>
          <div id="pctWrap" style="display:none;margin-top:8px;">
            <label for="fPct" class="hint">What % was for work?</label>
            <input id="fPct" type="number" min="1" max="100" value="80" />
          </div>
        </div>
        <div class="field"><label for="fPurpose">Purpose / note</label>
          <textarea id="fPurpose" rows="2" placeholder="Client showing, listing marketing…"></textarea>
        </div>
        <div class="field"><label>Receipt</label>
          <button class="receipt-btn" id="receiptBtn" type="button"><span class="ri">📸</span><span id="receiptName">No receipt attached</span></button>
          <input id="receiptInput" class="hidden-file" type="file" accept="image/*,.pdf" capture="environment" />
          <p class="ocr-status" id="ocrStatus"></p>
        </div>
        <button class="btn-primary" id="saveExpenseBtn" type="button">Save expense</button>
      </div>

      <div id="paneDrive" style="display:none;">
        <div class="field"><label for="dMiles">Miles</label>
          <input id="dMiles" class="amount-input" type="number" inputmode="decimal" step="0.1" min="0" placeholder="0" />
        </div>
        <div class="field"><label for="dPurpose">Purpose</label>
          <input id="dPurpose" type="text" placeholder="Showing — 123 Main St" autocomplete="off" />
        </div>
        <div class="field"><label for="dDate">Date</label><input id="dDate" type="date" /></div>
        <div class="field"><label for="dDeal">Property (deal)</label><select id="dDeal"></select></div>
        <div class="field"><label for="dFrom">From (optional)</label><input id="dFrom" type="text" autocomplete="off" /></div>
        <div class="field"><label for="dTo">To (optional)</label><input id="dTo" type="text" autocomplete="off" /></div>
        <p class="hint" id="driveRateHint"></p>
        <button class="btn-primary" id="saveDriveBtn" type="button">Save drive</button>
      </div>
    </div>

    <div class="toast" id="toast" role="status"></div>

    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
    <script src="js/store.js?v=7"></script>
    <script src="js/track.js?v=7"></script>
    <script src="js/ocr.js?v=7"></script>
    <script src="js/gps.js?v=7"></script>
    <script src="js/auth.js?v=7"></script>
    <script src="js/install.js?v=7"></script>
    <script src="js/talk-parse.js?v=8"></script>
    <script src="js/talk.js?v=8"></script>
    <script src="js/app.js?v=7"></script>
    <script src="js/views-home.js?v=7"></script>
    <script src="js/views-add.js?v=7"></script>
    <script src="js/views-drives.js?v=7"></script>
    <script src="js/views-deals.js?v=7"></script>
    <script src="js/views-reports.js?v=7"></script>
    <script src="js/views-settings.js?v=7"></script>
    <script>
      if ("serviceWorker" in navigator && location.protocol.indexOf("http") === 0) {
        window.addEventListener("load", function () {
          navigator.serviceWorker.register("sw.js?v=7").catch(function () {});
        });
      }
    </script>
  </body>
</html>
